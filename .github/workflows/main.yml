name: Auto Update sections.json

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate sections.json
        run: node generate-sections.js

      - name: Commit changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add sections.json

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Auto update sections.json"
            git push
          fi
